name: Bug report
description: Report a reproducible ShotPaste problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ShotPaste. Search existing issues first.
        Do not report security vulnerabilities or upload private captures, clipboard data, credentials, or unsanitized logs here.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Website
        - Cross-platform
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ShotPaste version
      placeholder: "For example: 1.12.2 or commit SHA"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "For example: macOS 15.6 arm64 or Windows 11 24H2 x64"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - GitHub Release
        - Built from source
        - Website
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic content and the smallest reliable sequence.
      placeholder: |
        1. Open ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include relevant error text or logs after removing private data. Do not paste an entire log archive.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed private captures, clipboard content, credentials, signing material, and personal paths.
          required: true
        - label: I searched existing issues and reproduced this on the version listed above.
          required: true
