<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LiteScreen Browser WGC Fixture</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      color: white;
      font: 700 32px/1.25 system-ui, sans-serif;
      background: hsl(194 82% 44%);
      animation: pulse 1.2s steps(6, end) infinite alternate;
    }
    main { padding: 36px; border: 8px solid white; border-radius: 22px; text-align: center; }
    small { display: block; margin-top: 18px; font-size: 18px; }
    @keyframes pulse {
      from { background: hsl(194 82% 44%); }
      to { background: hsl(262 72% 48%); }
    }
  </style>
</head>
<body>
  <main>
    BROWSER WINDOW · WGC TARGET
    <small id="clock">initializing audio/video fixture</small>
  </main>
  <script>
    const clock = document.getElementById('clock');
    setInterval(() => clock.textContent = `frame clock ${performance.now().toFixed(0)} ms`, 100);

    const audio = new AudioContext();
    const oscillator = audio.createOscillator();
    const gain = audio.createGain();
    oscillator.frequency.value = 523.25;
    gain.gain.value = 0.06;
    oscillator.connect(gain).connect(audio.destination);
    oscillator.start();
    audio.resume();
  </script>
</body>
</html>
