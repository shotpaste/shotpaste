# Stable macOS tags drive the macOS-only release below.
name: Release ShotPaste for macOS

on:
  push:
    tags:
      - "macos-v*.*.*"
      - "!macos-v*-*"
      - '!macos-v*\+*'

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate macOS release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify repository owner initiated the release
        shell: bash
        env:
          RELEASE_ACTOR: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ACTOR" == "$REPOSITORY_OWNER" ]] || {
            echo "::error::Official releases may be initiated only by the repository owner"
            exit 1
          }

      - name: Resolve stable semantic version
        id: release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if ! [[ "$TAG" =~ ^macos-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Official macOS tags must use macos-vMAJOR.MINOR.PATCH"
            exit 1
          fi

          git fetch --no-tags origin \
            "+refs/heads/release:refs/remotes/origin/release"
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          release_commit="$(git rev-parse "refs/remotes/origin/release^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" "$release_commit"; then
            echo "::error::macOS release tags must point to a commit contained in release"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#macos-v}" >> "$GITHUB_OUTPUT"

  macos:
    name: Build macOS arm64 DMG
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.2
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "arm64" ]] || {
            echo "::error::Expected an arm64 macOS runner; refusing to mislabel the package"
            exit 1
          }

      - name: Verify localization catalogs
        shell: bash
        run: |
          set -euo pipefail
          swift -module-cache-path build/swift-module-cache \
            platforms/mac/Tools/Localization/CatalogTool.swift verify

      - name: Run macOS tests
        shell: bash
        run: ./scripts/run-tests.sh

      - name: Import fixed release signing identity
        shell: bash
        env:
          SELF_SIGNED_CERT_P12: ${{ secrets.SELF_SIGNED_CERT_P12 }}
          SELF_SIGNED_CERT_PASSWORD: ${{ secrets.SELF_SIGNED_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          [[ -n "$SELF_SIGNED_CERT_P12" && -n "$SELF_SIGNED_CERT_PASSWORD" ]] || {
            echo "::error::SELF_SIGNED_CERT_P12 and SELF_SIGNED_CERT_PASSWORD are required"
            exit 1
          }

          keychain_path="$RUNNER_TEMP/shotpaste-release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          p12_path="$RUNNER_TEMP/shotpaste-release.p12"
          echo "::add-mask::$keychain_password"

          printf '%s' "$SELF_SIGNED_CERT_P12" | base64 --decode > "$p12_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security import "$p12_path" \
            -k "$keychain_path" \
            -P "$SELF_SIGNED_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          rm -f "$p12_path"

          identity_hash="$(security find-identity -p basic "$keychain_path" | awk '$2 ~ /^[[:xdigit:]]{40}$/ { print toupper($2); exit }')"
          expected_hash="$(
            openssl x509 \
              -in "$GITHUB_WORKSPACE/.github/signing/ShotPaste-Release-Self-Signed.crt" \
              -noout -fingerprint -sha1 \
              | awk -F= '{ gsub(":", "", $2); print toupper($2) }'
          )"
          [[ -n "$identity_hash" ]] || {
            echo "::error::The imported P12 does not contain a usable code-signing identity"
            exit 1
          }
          [[ "$identity_hash" == "$expected_hash" ]] || {
            echo "::error::The imported certificate does not match the fixed ShotPaste release identity"
            exit 1
          }

          echo "SHOTPASTE_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "SHOTPASTE_CODESIGN_IDENTITY=$identity_hash" >> "$GITHUB_ENV"
          echo "SHOTPASTE_CODESIGN_TIMESTAMP=none" >> "$GITHUB_ENV"
          echo "SHOTPASTE_ALLOW_UNTRUSTED_SELF_SIGNED=1" >> "$GITHUB_ENV"

      - name: Build and sign canonical Release app
        shell: bash
        env:
          SHOTPASTE_MARKETING_VERSION: ${{ needs.metadata.outputs.version }}
          SHOTPASTE_BUILD_NUMBER: ${{ github.run_number }}
          SHOTPASTE_RELEASE_ARM64_ONLY: "1"
        run: |
          set -euo pipefail
          ./scripts/build_and_run.sh build --configuration Release

          app="$GITHUB_WORKSPACE/.build/macos/Release/ShotPaste.app"
          binary="$app/Contents/MacOS/ShotPaste"
          actual_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          actual_build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")
          architectures="$(lipo -archs "$binary")"

          [[ "$actual_version" == "$SHOTPASTE_MARKETING_VERSION" ]] || {
            echo "::error::App version $actual_version does not match release version $SHOTPASTE_MARKETING_VERSION"
            exit 1
          }
          [[ "$actual_build" == "$SHOTPASTE_BUILD_NUMBER" ]] || {
            echo "::error::App build $actual_build does not match Actions run number $SHOTPASTE_BUILD_NUMBER"
            exit 1
          }
          [[ "$architectures" == "arm64" ]] || {
            echo "::error::Expected an arm64-only executable, found: $architectures"
            exit 1
          }
          codesign --verify --deep --strict --verbose=2 "$app"

          app_count=$(find "$GITHUB_WORKSPACE" -type d -name 'ShotPaste.app' -prune | wc -l | tr -d ' ')
          [[ "$app_count" == "1" ]] || {
            echo "::error::Expected exactly one Release app bundle, found $app_count"
            find "$GITHUB_WORKSPACE" -type d -name 'ShotPaste.app' -prune -print
            exit 1
          }

      - name: Create and verify DMG
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/.build/macos/Release/ShotPaste.app"
          staging="$RUNNER_TEMP/shotpaste-dmg-root"
          dmg="build/release/ShotPaste-v${VERSION}-macOS-arm64.dmg"

          rm -rf "$staging"
          mkdir -p build/release "$staging"
          find build/release -maxdepth 1 -type f -name '*.dmg' -delete
          ditto "$app" "$staging/ShotPaste.app"
          ln -s /Applications "$staging/Applications"
          sed "s/@VERSION@/$VERSION/g" docs/release/START-HERE-macOS.txt > "$staging/START-HERE-macOS.txt"
          cp LICENSE "$staging/LICENSE.txt"
          cp THIRD_PARTY_NOTICES.md "$staging/THIRD_PARTY_NOTICES.md"

          hdiutil create \
            -volname "ShotPaste $VERSION" \
            -srcfolder "$staging" \
            -format UDZO \
            -ov \
            "$dmg"
          hdiutil verify "$dmg"
          rm -rf "$staging"

          dmg_count=$(find build/release -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')
          [[ "$dmg_count" == "1" ]] || {
            echo "::error::Expected exactly one macOS DMG, found $dmg_count"
            exit 1
          }

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          keychain_path="$RUNNER_TEMP/shotpaste-release.keychain-db"
          p12_path="$RUNNER_TEMP/shotpaste-release.p12"
          rm -f "$p12_path"
          if [[ -f "$keychain_path" ]]; then
            login_keychain="$HOME/Library/Keychains/login.keychain-db"
            if [[ -f "$login_keychain" ]]; then
              security list-keychains -d user -s "$login_keychain" 2>/dev/null || true
            fi
            security delete-keychain "$keychain_path" 2>/dev/null || true
          fi

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: build/release/ShotPaste-v${{ needs.metadata.outputs.version }}-macOS-arm64.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish macOS GitHub Release
    needs:
      - metadata
      - macos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download macOS release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos
          path: dist

      - name: Create and verify checksums and startup guide
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          cd dist

          package="ShotPaste-v${VERSION}-macOS-arm64.dmg"
          [[ -f "$package" ]] || {
            echo "::error::The macOS package is required before publishing"
            exit 1
          }

          package_count=$(find . -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')
          [[ "$package_count" == "1" ]] || {
            echo "::error::Expected exactly one macOS package, found $package_count"
            exit 1
          }

          sha256sum "$package" > SHA256SUMS.txt
          sed "s/@VERSION@/$VERSION/g" ../docs/release/START-HERE-macOS.txt \
            > "ShotPaste-v${VERSION}-START-HERE-macOS.txt"
          sha256sum --check SHA256SUMS.txt

      - name: Publish non-draft macOS release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite it"
            exit 1
          fi

          previous_tag="$(
            git tag --list 'macos-v*.*.*' --sort=-version:refname \
              | grep -Fvx "$TAG" \
              | head -n 1 || true
          )"
          notes=$(sed "s/@VERSION@/$VERSION/g" docs/release/RELEASE-NOTES-INTRO-macOS.md)
          release_args=(
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --title "ShotPaste for macOS v$VERSION"
            --generate-notes
            --latest=false
            --notes "$notes"
          )
          if [[ -n "$previous_tag" ]]; then
            release_args+=(--notes-start-tag "$previous_tag")
          fi

          gh release create "$TAG" \
            dist/*.dmg \
            dist/SHA256SUMS.txt \
            dist/*START-HERE*.txt \
            "${release_args[@]}"

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json url,tagName,isDraft,isPrerelease,assets
