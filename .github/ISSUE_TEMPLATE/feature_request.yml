name: Feature request
description: Propose a focused product improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before proposing an implementation. Large architecture or data-format changes should be discussed before coding.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who is affected, and what workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior and success criteria.
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      multiple: true
      options:
        - macOS
        - Windows
        - Website
        - Shared behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include current workarounds and relevant OS constraints.
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and requests.
          required: true
        - label: This request contains no private captures, clipboard data, credentials, or personal information.
          required: true
